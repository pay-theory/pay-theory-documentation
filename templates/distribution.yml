AWSTemplateFormatVersion: '2010-09-09'
Description: Pay Theory Developer Portal
Parameters:
  Partner:
    Type: String
    Description: The environment you're deploying to.
  Stage:
    Type: String
    Description: Library stage to use.
  Repository:
    Type: String
    Description: Repository to use.
    Default: pay-theory-documentation
  TargetMode:
    Type: String
    Description: The Deployment Mode
    Default: standard
    AllowedValues:
      - standard
      - '-new'
      - '-old'
  DeployRoleName:
    Type: String
    Description: Role that runs 02_deploy.sh and assumes the edge routes sync role.
    Default: pt-global-codebuild-role
  # Retired Lambda@Edge inputs. 02_deploy.sh no longer passes them, so the stack
  # keeps their last values and the old Lambda resources stay unchanged until a
  # follow-up removes them (see adr/0002).
  MarkdownEdgeLambdaS3Bucket:
    Type: String
    Description: S3 bucket containing the packaged Markdown Lambda@Edge artifact.
    Default: ''
  MarkdownEdgeLambdaS3Key:
    Type: String
    Description: S3 key for the packaged Markdown Lambda@Edge artifact.
    Default: ''
Conditions:
  isStandard: !Equals [ !Ref TargetMode, standard]
  HasMarkdownEdgeLambdaArtifact: !And
    - !Not [!Equals [!Ref MarkdownEdgeLambdaS3Bucket, '']]
    - !Not [!Equals [!Ref MarkdownEdgeLambdaS3Key, '']]
Resources:
  V2HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !If [
        isStandard,
        !Sub "docs.${Stage}.com",
        !Sub "docs.${Stage}.com" ]

  V2Route53NSRecordUpdater:
    Type: Custom::NSRecordUpdater
    Properties:
      ServiceToken: !Sub '{{resolve:ssm:route53-recordset-updater-lambda-arn}}'
      DomainName: !Sub '${Stage}.com'
      SubdomainName: !If [
        isStandard,
        !Sub "docs.${Stage}.com",
        !Sub "docs.${Stage}.com" ]
      NameServersList: !GetAtt "V2HostedZone.NameServers"

  V2Certificate:
    Type: Custom::Certificate
    DependsOn:
      - V2Route53NSRecordUpdater
    Properties:
      ServiceToken: !Sub '{{resolve:ssm:certificate-validator-lambda-arn}}'
      DomainName: !If [
        isStandard,
        !Sub "docs.${Stage}.com",
        !Sub "docs.${Stage}.com" ]

  V2CertificateValidator:
    Type: Custom::CertificateValidator
    DependsOn:
      - V2Certificate
    Properties:
      ServiceToken: !Sub '{{resolve:ssm:certificate-validator-lambda-arn}}'
      CertificateArn: !GetAtt V2Certificate.CertificateArn

  HostedZoneParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${Repository}-${Partner}-${Stage}-hosted-zone'
      Type: String
      Value: !Ref V2HostedZone
      Description: !Sub 'Hosted zone for ${Repository}-${Partner}-${Stage}'

  CertificateArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${Repository}-${Partner}-${Stage}-certificate-arn'
      Type: String
      Value: !GetAtt V2Certificate.CertificateArn
      Description: !Sub 'Certificate arn for ${Repository}-${Partner}-${Stage}'

  # Lists every docs route for the edge function in formation.yml.
  # scripts/sync-edge-routes.js fills it on each deploy.
  EdgeRoutesKeyValueStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: !Sub '${Repository}-${Partner}-${Stage}-routes'
      Comment: !Sub 'Docs routes for ${Repository}-${Partner}-${Stage}'

  EdgeRoutesKvsArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${Repository}-${Partner}-${Stage}-edge-routes-kvs-arn'
      Type: String
      Value: !GetAtt EdgeRoutesKeyValueStore.Arn
      Description: !Sub 'Edge routes key value store ARN for ${Repository}-${Partner}-${Stage}'

  # Writes to the route store need the cloudfront-keyvaluestore API, which the
  # shared deploy role doesn't grant. 02_deploy.sh assumes this role for the sync.
  EdgeRoutesSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Repository}-${Partner}-${Stage}-edge-routes-sync'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeployRoleName}'
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: edge-routes-sync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront-keyvaluestore:DescribeKeyValueStore
                  - cloudfront-keyvaluestore:ListKeys
                  - cloudfront-keyvaluestore:UpdateKeys
                Resource: !GetAtt EdgeRoutesKeyValueStore.Arn

  EdgeRoutesSyncRoleArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${Repository}-${Partner}-${Stage}-edge-routes-sync-role-arn'
      Type: String
      Value: !GetAtt EdgeRoutesSyncRole.Arn
      Description: !Sub 'Role that syncs the edge routes store for ${Repository}-${Partner}-${Stage}'

  # Retired: CloudFront now uses the CloudFront Function in formation.yml.
  # Remove these four resources a few hours after the switch, once Lambda@Edge
  # has deleted the replicas.
  MarkdownEdgeLambdaRole:
    Condition: HasMarkdownEdgeLambdaArtifact
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Repository}-${Partner}-${Stage}-markdown-edge'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  MarkdownEdgeLambdaFunction:
    Condition: HasMarkdownEdgeLambdaArtifact
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Repository}-${Partner}-${Stage}-markdown-edge'
      Description: !Sub 'Markdown negotiation for ${Repository}-${Partner}-${Stage}'
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt MarkdownEdgeLambdaRole.Arn
      MemorySize: 128
      Timeout: 3
      Code:
        S3Bucket: !Ref MarkdownEdgeLambdaS3Bucket
        S3Key: !Ref MarkdownEdgeLambdaS3Key

  # Keep replaced versions. CloudFront still uses the old version until the
  # formation stack updates, so deleting it here fails and CloudFormation
  # retries for ~6 minutes. Prune old versions by hand.
  MarkdownEdgeLambdaVersion:
    Condition: HasMarkdownEdgeLambdaArtifact
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref MarkdownEdgeLambdaFunction
      Description: !Sub 'Markdown edge artifact ${MarkdownEdgeLambdaS3Key}'

  MarkdownEdgeLambdaVersionArnParameter:
    Condition: HasMarkdownEdgeLambdaArtifact
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '${Repository}-${Partner}-${Stage}-markdown-edge-lambda-version-arn'
      Type: String
      Value: !Ref MarkdownEdgeLambdaVersion
      Description: !Sub 'Published Lambda@Edge version ARN for ${Repository}-${Partner}-${Stage}'

Outputs:
  Renew:
    Description: Trigger to update/rebuild formation
    Value: 'Mar 14 2022'
  EdgeRoutesKvsArn:
    Description: Edge routes key value store ARN.
    Value: !GetAtt EdgeRoutesKeyValueStore.Arn
  EdgeRoutesSyncRoleArn:
    Description: Role that syncs the edge routes store.
    Value: !GetAtt EdgeRoutesSyncRole.Arn
  MarkdownEdgeLambdaVersionArn:
    Condition: HasMarkdownEdgeLambdaArtifact
    Description: Published Lambda@Edge version ARN.
    Value: !Ref MarkdownEdgeLambdaVersion
